<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body {
  background: #0a0a0a;
  color: white;
  font-family: 'Inter', sans-serif;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.container {
  max-width: 400px;
}

h1 {
  font-weight: 400;
  letter-spacing: 3px;
  font-size: 18px;
  margin-bottom: 20px;
  text-transform: uppercase;
}

p {
  color: #888;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 30px;
}

a {
  display: inline-block;
  padding: 12px 20px;
  border: 1px solid #333;
  border-radius: 8px;
  color: white;
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

a:hover {
  background: white;
  color: black;
}

</style>
</head>

<body>

<div class="container">

<h1>Thank You</h1>

<p>
Your order has been successfully placed.<br>
You will receive a confirmation email shortly.
</p>

<a href="index.html">Back to Home</a>

</div>

</body>
</html>
